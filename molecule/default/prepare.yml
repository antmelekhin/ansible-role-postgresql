---
- name: 'Prepare'
  hosts: all
  tasks:
    - name: 'Debian | Install procps package'
      ansible.builtin.apt:
        name: 'procps'
        update_cache: true
        cache_valid_time: 3600
        state: 'present'
      when: ansible_os_family == 'Debian'

    - name: 'RedHat | Install procps package'
      ansible.builtin.yum:
        name: 'procps-ng'
        update_cache: true
        state: 'present'
      when: ansible_os_family == 'RedHat'
