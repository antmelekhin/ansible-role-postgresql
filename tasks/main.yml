---
- name: 'Install PostgreSQL'
  ansible.builtin.include_tasks: "install-{{ ansible_facts['os_family'] }}.yml"

- name: 'Configure PostgreSQL'
  ansible.builtin.import_tasks: 'configure.yml'

- name: 'Manage PostgreSQL users'
  ansible.builtin.include_tasks: 'manage/users.yml'
  when: postgresql_users | length > 0

- name: 'Manage PostgreSQL databases'
  ansible.builtin.include_tasks: 'manage/databases.yml'
  when: postgresql_databases | length > 0

- name: 'Manage PostgreSQL users privileges'
  ansible.builtin.include_tasks: 'manage/users-privileges.yml'
  when: postgresql_users | length > 0
