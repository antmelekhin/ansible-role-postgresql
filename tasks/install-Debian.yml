---
- name: 'Debian | Configure the repository and install the PostgreSQL packages'
  become: true
  block:
    - name: 'Debian | Ensure the dependencies are installed'
      ansible.builtin.apt:
        name:
          - 'apt-transport-https'
          - 'ca-certificates'
          - 'gnupg'
        update_cache: true
        cache_valid_time: 3600
        state: 'present'
      check_mode: false

    - name: 'Debian | Add the PostgreSQL repository GPG key'
      ansible.builtin.apt_key:
        url: '{{ postgresql_repository_gpgkey_url }}'
        keyring: '{{ __postgresql_repository_gpgkey_keyring }}'
        state: 'present'

    - name: 'Debian | Add the PostgreSQL repository'
      ansible.builtin.template:
        src: 'pgdg.list.j2'
        dest: '/etc/apt/sources.list.d/pgdg.list'
        owner: 'root'
        group: 'root'
        mode: 0644

    - name: 'Debian | Install the PostgreSQL packages'
      ansible.builtin.apt:
        name:
          - 'postgresql-{{ postgresql_version }}'
          - 'postgresql-client-{{ postgresql_version }}'
          - 'python3-psycopg2'
        update_cache: true
        state: 'present'
      ignore_errors: '{{ ansible_check_mode }}'
